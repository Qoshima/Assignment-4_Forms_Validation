<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="part2.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Assignment 4</div>
    <ul class="nav-links">
        <li><a href="index.html">Part 1</a></li>
        <li><a href="part2.html">Part 2</a></li>
        <li><a href="part3.html">Part 3</a></li>
    </ul>
</nav>

<div class="container mt-4">
    <div class="forms-wrapper">
        <div class="card shadow-sm form-card">
            <div class="card-body">
                <h2 class="mb-3">Task 2</h2>
                <form id="task2form" novalidate>
                    <div class="col-12 mb-3">
                        <label for="t2name" class ="form-label">Name</label>
                        <input type="text" class="form-control" id="t2name" placeholder="Input your name" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="t2email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="t2email" placeholder="example@mail.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="t2ephone" class="form-label">Phone Number</label>
                            <input type="number" class="form-control" id="t2ephone" placeholder="123-456-7890" required>
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <label for="t2message" class="form-label">Message</label>
                        <textarea class="form-control" id="t2message" rows="3" placeholder="Your text..." required></textarea>
                        <div class="form-text">I share your message with everyone</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm form-card">
            <div class="card-body">
                <h2 class="mb-3">Task 3</h2>
                <form id="task3form" novalidate>
                    <div class="col-12 mb-3">
                        <label for="t3name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="t3name" placeholder="Input your name" required>
                        <div class="invalid-feedback">Name is required</div>
                        <div class="valid-feedback">Looks good</div>
                    </div>
                    <div class="col-12 mb-3">
                        <label for="t3email" class="form-label">Email</label>
                        <input type="text" class="form-control" id="t3email" placeholder="Input your email" required>
                        <div class="invalid-feedback">Email is required</div>
                        <div class="valid-feedback">Looks good</div>
                    </div>
                    <div class="col-12 mb-3">
                        <label for="t3username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="t3username" placeholder="4-12 symbols" required minlength="4" maxlength="12" pattern="^[a-z0-9_]+">
                        <div class="invalid-feedback">4-12 symbols. lowercase, numbers, underscore</div>
                        <div class="valid-feedback">Looks good</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const forms = document.querySelectorAll('form:not([data-no-validation])');
    forms.forEach(form => {
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (form.checkValidity()) {
                form.classList.add('was-validated');
                form.reset();
            } else {
                form.classList.add('was-validated');
            }
        });
    });
</script>
</body>
</html>
