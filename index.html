<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="part1.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Assignment 4</div>
    <ul class="nav-links">
        <li><a href="index.html">Part 1</a></li>
        <li><a href="part2.html">Part 2</a></li>
        <li><a href="part3.html">Part 3</a></li>
    </ul>
</nav>
<div class="forms-wrapper">
    <div class="form-container">
        <h2>Task 0</h2>
        <form id="contactform">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="Input your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea name="message" id="message" cols="15" placeholder="Message.." required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <div class="form-container">
        <h2>Task 1</h2>
        <form id="task1form">
            <div class="form-group">
                <label for="name1">Name <span class="req">*</span></label>
                <input type="text" name="name" id="name1" placeholder="Input your name" required minlength="2" maxlength="30">
            </div>
            <div class="form-group">
                <label for="email1">Email <span class="req">*</span></label>
                <input type="email" name="email" id="email1" required placeholder="example@mail.com" maxlength="50">
            </div>
            <div class="form-group">
                <label for="phone1">Phone <span class="req">*</span></label>
                <input type="number" name="phone" id="phone1" placeholder="123-456-7890" maxlength="15" required pattern="[0-9]{3}-[0-9]{3}" title="10-15 symbols: numbers, +, -, brackets">
            </div>
            <div class="form-group">
                <label for="username">Username <span class="req">*</span></label>
                <input type="text" id="username" name="username" required minlength="4" maxlength="12" pattern="[a-z0-9_]+" title="4–12 symbols">
            </div>
            <div class="form-group">
                <label for="age">Age <span class="req">*</span></label>
                <input type="number" name="age" id="age" required min="16" max="100" step="1">
            </div>
            <div class="form-group">
                <label for="date">Date <span class="req">*</span></label>
                <input type="date" name="date" id="date" required min="1970-01-01" max="2050-01-30">
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="agree" id="id" required>
                    I agree to the terms and conditions
                </label>
            </div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>
</div>
</body>
</html>
