<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="part3.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Assignment 4</div>
    <ul class="nav-links">
        <li><a href="index.html">Part 1</a></li>
        <li><a href="part2.html">Part 2</a></li>
        <li><a href="part3.html">Part 3</a></li>
    </ul>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm form-card mx-auto">
        <div class="card-body">
            <h2 class="mb-3">Task 4</h2>
            <form id="registerForm" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Yernur" required minlength="2" pattern="^[A-Za-z]+$">
                        <div class="invalid-feedback">First name is required</div>
                        <div class="valid-feedback">Looks good</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Alimbekov" required minlength="2" pattern="^[A-Za-z]+$">
                        <div class="invalid-feedback">Last name is required</div>
                        <div class="valid-feedback">Looks good</div>
                    </div>
                </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Min 8 symbols" required minlength="8">
                            <div class="invalid-feedback">Password must be atleast 8 symbols</div>
                            <div class="valid-feedback">Looks good</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required minlength="8">
                            <div class="invalid-feedback" id="confirmFeedback">Passwords do not match</div>
                            <div class="valid-feedback">Looks good</div>
                        </div>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">Gender</legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
                            <label class="form-check-label" for="other">Other</label>
                        </div>
                        <div class="invalid-feedback">Please select a gender</div>
                    </fieldset>

                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">Hobbies</legend>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="h_reading" name="hobbies" value="reading">
                                    <label class="form-check-label" for="h_reading">Reading</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="h_coding" name="hobbies" value="coding">
                                    <label class="form-check-label" for="h_coding">Coding</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="h_listening" name="hobbies" value="listening music">
                                    <label class="form-check-label" for="h_listening">Listening music</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="h_sport" name="hobbies" value="sport">
                                    <label class="form-check-label" for="h_sport">Sport</label>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <div class="col-12 mb-3">
                        <label for="country" class="form-label">Country</label>
                        <select class="form-select" id="country" name="country" required>
                            <option selected disabled value="">Choose...</option>
                            <option value="rus">Russia</option>
                            <option value="uk">United Kingdom</option>
                            <option value="us">United States</option>
                            <option value="kaz">Kazakhstan</option>
                            <option value="ger">Germany</option>
                            <option value="fr">France</option>
                        </select>
                        <div class="invalid-feedback">Please select a country</div>
                        <div class="valid-feedback">good job</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Register</button>
                        <button type="reset" class="btn btn-primary flex-grow-1">Reset</button>
                    </div>

                    <p id="regSuccess" class="text-success fw-bold mt-3 d-none">
                        Registration successful
                    </p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirmPassword");
    const successMsg = document.getElementById("regSuccess");

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        event.stopPropagation();

        if (password.value !== confirm.value) {
            confirm.setCustomValidity("Passwords don't match");
        } else {
            confirm.setCustomValidity("");
        }
        if (form.checkValidity()) {
            form.classList.add("was-validated");
            form.reset();
            successMsg.classList.remove("d-none");
            setTimeout(() => successMsg.classList.add("d-none"), 4000);
        } else {
            form.classList.add("was-validated");
        }
    });
</script>
</body>
</html>
